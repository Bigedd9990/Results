
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="30">
  <title>Esquina Park Rangers - League Standings</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --maroon: #581b32;
      --light-blue: #8ed0e8;
      --pale-blue: #eaf7fc;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
  margin: 0;
  padding: 0;
  background: #f1f5f8;
  color: #222;
  font-family: Arial, Helvetica, sans-serif;
}

.page {
  width: 100%;
  max-width: none;
  margin: 0;
  background: white;
  border-radius: 0;
  overflow: hidden;
  box-shadow: none;
}

    header {
      background: var(--maroon);
      color: white;
      padding: 22px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      text-align: center;
      border-bottom: 7px solid var(--light-blue);
    }

    .header-logo {
      width: 76px;
      height: 76px;
      object-fit: contain;
      flex-shrink: 0;
    }

    h1 {
      font-size: clamp(23px, 4vw, 42px);
      margin: 0;
      font-weight: 900;
      line-height: 1.15;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--light-blue);
      font-size: 17px;
      font-weight: bold;
    }

    .status {
  background: #f1f5f8;
  color: #581b32;
  text-align: center;
  padding: 10px;
  font-size: 13px;
  font-weight: 900;
}

    
.table-wrap {
  width: 100%;
  padding: 8px;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: auto;
  font-size: clamp(18px, 2vw, 28px);
}

thead th {
  background: #581b32;
  color: white;
  padding: 16px 10px;
  font-size: clamp(16px, 1.8vw, 24px);
  font-weight: 900;
  text-align: center;
  white-space: nowrap;
}

thead th:nth-child(2),
tbody td:nth-child(2) {
  width: 60px;
  min-width: 45px;
  padding: 5px;
}

tbody td {
  padding: 15px 10px;
  border-bottom: 2px solid #d7e1e7;
  text-align: center;
  font-size: clamp(18px, 2vw, 28px);
  font-weight: 900;
}

tbody tr:nth-child(even) {
  background: #eaf7fc;
}

tbody tr:first-child td {
  background: #fff5d8;
}

tbody td:nth-child(1) {
  color: #581b32;
  font-size: 1.15em;
  font-weight: 900;
}

tbody td:nth-child(3) {
  text-align: left;
  min-width: 180px;
  color: #581b32;
  font-weight: 900;
}

.team-badge {
  display: block;
  width: 44px;
  height: 44px;
  object-fit: contain;
  margin: auto;
}

.points {
  color: #581b32;
  font-size: 1.2em;
  font-weight: 900;
}

.footer {
  padding: 15px;
  text-align: center;
  background: #581b32;
  color: white;
  font-size: 15px;
  font-weight: 900;
}


    @media (max-width: 600px) {
      body { padding: 5px; }
      header { gap: 9px; padding: 16px 7px; }
      .header-logo { width: 48px; height: 48px; }
      .subtitle { font-size: 13px; }
      .table-wrap { padding: 5px; }
      thead th, tbody td { padding: 9px 6px; }
      .team-badge { width: 32px; height: 32px; }
      thead th:nth-child(2), tbody td:nth-child(2) {
        width: 40px;
        min-width: 40px;
      }
    }
  </style>
</head>

<body>
<div class="page">

  <header>
    <img class="header-logo"
         src="badges/Esquina Park Rangers.png"
         alt="Esquina Park Rangers"
         onerror="this.style.display='none'">

    <div>
      <h1>ESQUINA PARK RANGERS</h1>
      <div class="subtitle">INTERNATIONAL WALKING FOOTBALL CUP</div>
      <div class="subtitle">LEAGUE STANDINGS</div>
    </div>

    <img class="header-logo"
         src="badges/Rojales.png"
         alt="Rojales"
         onerror="this.style.display='none'">
  </header>

  

  <div class="table-wrap">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">
    ESQUINA PARK RANGERS · LIVE TOURNAMENT STANDINGS
  </div>
  <div class="status" id="status">Loading league standings...
</div>

<script>
  const CSV_URL =
    "https://script.google.com/macros/s/AKfycbxQQB-Fi9liFMcjkULvSWaboQBZ9OTBqrmcxORx0MJU69lJsKfguEBFAoxhMc6B6LJBRA/exec";

  const REFRESH_INTERVAL_MS = 15000;

  // Google Sheets range B3:L18:
  // B Rank, C badge, D Team, E Pld, F W, G D,
  // H L, I GF, J GA, K GD, L Pts.

  const HEADINGS = [
    "Rank", "", "Team", "Pld", "W", "D",
    "L", "GF", "GA", "GD", "Pts"
  ];

  function normalise(value) {
    return String(value || "")
      .trim()
      .toLowerCase()
      .replace(/\.png$/i, "")
      .replace(/\.jpe?g$/i, "")
      .replace(/\.webp$/i, "")
      .replace(/[^a-z0-9]/g, "");
  }

  function badgeHtml(teamName) {
    if (!teamName) return "";

    // Badge filenames should match the team name.
    // Both .png and .jpg/.jpeg/.webp are tried.
    const extensions = ["png", "jpg", "jpeg", "webp"];
    const base = "badges/" + String(teamName).trim();

    const candidates = extensions.map(ext =>
      base + "." + ext
    );

    const fallback = "badges/" +
      String(teamName).trim().toLowerCase() + ".png";

    return `<img class="team-badge"
      src="${candidates[0]}"
      data-candidates='${JSON.stringify(candidates)}'
      alt="${escapeHtml(teamName)} badge"
      onerror="tryNextBadge(this)">`;
  }

  function tryNextBadge(img) {
    const candidates = JSON.parse(
      img.getAttribute("data-candidates") || "[]"
    );

    const current = Number(img.dataset.tryIndex || 0) + 1;

    if (current < candidates.length) {
      img.dataset.tryIndex = current;
      img.src = candidates[current];
    } else {
      img.style.display = "none";
    }
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  



function renderTable(allRows) {
  // Feed already contains 11 columns:
  // Rank, blank badge column, Team, Pld, W, D, L,
  // GF, GA, GD, Pts.

  const rows = allRows
    .filter(row => row && row.length >= 11)
    .filter(row => /^\d+$/.test(String(row[0] || "").trim()))
    .slice(0, 16);

  const headings = [
    "Rank", "", "Team", "Pld", "W", "D",
    "L", "GF", "GA", "GD", "Pts"
  ];

  const head = document.getElementById("tableHead");
  const body = document.getElementById("tableBody");

  head.innerHTML = "<tr>" + headings.map(h =>
    `<th>${escapeHtml(h)}</th>`
  ).join("") + "</tr>";

  body.innerHTML = rows.map(row => {
    const team = row[2] || "";

    const values = [
      row[0] || "", // Rank
      "",           // Badge image goes here
      team,         // Team name
      row[3] || "", // Pld
      row[4] || "", // W
      row[5] || "", // D
      row[6] || "", // L
      row[7] || "", // GF
      row[8] || "", // GA
      row[9] || "", // GD
      row[10] || "" // Pts
    ];

    return "<tr>" + values.map((value, index) => {
      if (index === 1) {
        return `<td>${badgeHtml(team)}</td>`;
      }

      const className = index === 10
        ? ' class="points"'
        : "";

      return `<td${className}>${escapeHtml(value)}</td>`;
    }).join("") + "</tr>";
  }).join("");

 
const spanishTime = new Date().toLocaleTimeString("en-GB", {
  timeZone: "Europe/Madrid",
  hour: "2-digit",
  minute: "2-digit",
  second: "2-digit",
  hour12: false
});

document.getElementById("status").textContent =
  "Last updated " + spanishTime + " · Spanish local time";

}



  async function loadStandings() {
    const status = document.getElementById("status");

    try {
      const url = CSV_URL +
        (CSV_URL.includes("?") ? "&" : "?") +
        "t=" + Date.now();

      const response = await fetch(url, { cache: "no-store" });

      if (!response.ok) {
        throw new Error("Unable to retrieve the spreadsheet.");
      }

      const text = await response.text();

      const parsed = Papa.parse(text, {
        skipEmptyLines: false
      });

      if (parsed.errors && parsed.errors.length &&
          !parsed.data.length) {
        throw new Error("The spreadsheet data could not be read.");
      }

      renderTable(parsed.data);
    } catch (error) {
      console.error(error);
      status.textContent =
        "Unable to refresh standings. Retrying shortly...";
    }
  }

  loadStandings();
  setInterval(loadStandings, REFRESH_INTERVAL_MS);
</script>
</body>
</html>
