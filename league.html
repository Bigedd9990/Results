
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="30">
  <title>Esquina Park Rangers - League Standings</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --maroon: #581b32;
      --light-blue: #8ed0e8;
      --pale-blue: #eaf7fc;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      background: #f1f5f8;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      max-width: 1500px;
      margin: auto;
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 18px #00000018;
    }

    header {
      background: var(--maroon);
      color: white;
      padding: 22px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      text-align: center;
      border-bottom: 7px solid var(--light-blue);
    }

    .header-logo {
      width: 76px;
      height: 76px;
      object-fit: contain;
      flex-shrink: 0;
    }

    h1 {
      font-size: clamp(23px, 4vw, 42px);
      margin: 0;
      font-weight: 900;
      line-height: 1.15;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--light-blue);
      font-size: 17px;
      font-weight: bold;
    }

    .status {
      text-align: center;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      color: var(--maroon);
      background: var(--pale-blue);
    }

    .table-wrap {
      padding: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
      font-size: clamp(15px, 1.6vw, 21px);
    }

    thead th {
      background: var(--maroon);
      color: white;
      padding: 14px 9px;
      font-weight: 900;
      text-align: center;
      white-space: nowrap;
      border: 1px solid #ffffff30;
    }

    thead th:nth-child(2) {
      width: 58px;
      min-width: 58px;
      padding: 5px;
    }

    tbody td {
      padding: 12px 9px;
      border-bottom: 1px solid #d7e1e7;
      text-align: center;
      font-weight: 700;
    }

    tbody tr:nth-child(even) {
      background: var(--pale-blue);
    }

    tbody tr:first-child td {
      background-color: #fff5d8;
    }

    tbody td:nth-child(1) {
      color: var(--maroon);
      font-size: 1.1em;
      font-weight: 900;
    }

    tbody td:nth-child(2) {
      width: 58px;
      padding: 5px;
    }

    tbody td:nth-child(3) {
      text-align: left;
      min-width: 150px;
      font-weight: 900;
      color: var(--maroon);
    }

    .team-badge {
      display: block;
      width: 42px;
      height: 42px;
      object-fit: contain;
      margin: auto;
    }

    .points {
      color: var(--maroon);
      font-size: 1.12em;
      font-weight: 900;
    }

    .footer {
      padding: 13px;
      text-align: center;
      background: var(--maroon);
      color: white;
      font-size: 13px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      body { padding: 5px; }
      header { gap: 9px; padding: 16px 7px; }
      .header-logo { width: 48px; height: 48px; }
      .subtitle { font-size: 13px; }
      .table-wrap { padding: 5px; }
      thead th, tbody td { padding: 9px 6px; }
      .team-badge { width: 32px; height: 32px; }
      thead th:nth-child(2), tbody td:nth-child(2) {
        width: 40px;
        min-width: 40px;
      }
    }
  </style>
</head>

<body>
<div class="page">

  <header>
    <img class="header-logo"
         src="badges/Esquina Park Rangers.png"
         alt="Esquina Park Rangers"
         onerror="this.style.display='none'">

    <div>
      <h1>ESQUINA PARK RANGERS</h1>
      <div class="subtitle">INTERNATIONAL WALKING FOOTBALL CUP</div>
      <div class="subtitle">LEAGUE STANDINGS</div>
    </div>

    <img class="header-logo"
         src="badges/Rojales.png"
         alt="Rojales"
         onerror="this.style.display='none'">
  </header>

  <div class="status" id="status">Loading league standings...</div>

  <div class="table-wrap">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">
    ESQUINA PARK RANGERS · LIVE TOURNAMENT STANDINGS
  </div>
</div>

<script>
  const CSV_URL =
    "https://script.google.com/macros/s/AKfycbxQQB-Fi9liFMcjkULvSWaboQBZ9OTBqrmcxORx0MJU69lJsKfguEBFAoxhMc6B6LJBRA/exec";

  const REFRESH_INTERVAL_MS = 15000;

  // Google Sheets range B3:L18:
  // B Rank, C badge, D Team, E Pld, F W, G D,
  // H L, I GF, J GA, K GD, L Pts.

  const HEADINGS = [
    "Rank", "", "Team", "Pld", "W", "D",
    "L", "GF", "GA", "GD", "Pts"
  ];

  function normalise(value) {
    return String(value || "")
      .trim()
      .toLowerCase()
      .replace(/\.png$/i, "")
      .replace(/\.jpe?g$/i, "")
      .replace(/\.webp$/i, "")
      .replace(/[^a-z0-9]/g, "");
  }

  function badgeHtml(teamName) {
    if (!teamName) return "";

    // Badge filenames should match the team name.
    // Both .png and .jpg/.jpeg/.webp are tried.
    const extensions = ["png", "jpg", "jpeg", "webp"];
    const base = "badges/" + String(teamName).trim();

    const candidates = extensions.map(ext =>
      base + "." + ext
    );

    const fallback = "badges/" +
      String(teamName).trim().toLowerCase() + ".png";

    return `<img class="team-badge"
      src="${candidates[0]}"
      data-candidates='${JSON.stringify(candidates)}'
      alt="${escapeHtml(teamName)} badge"
      onerror="tryNextBadge(this)">`;
  }

  function tryNextBadge(img) {
    const candidates = JSON.parse(
      img.getAttribute("data-candidates") || "[]"
    );

    const current = Number(img.dataset.tryIndex || 0) + 1;

    if (current < candidates.length) {
      img.dataset.tryIndex = current;
      img.src = candidates[current];
    } else {
      img.style.display = "none";
    }
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  
function renderTable(allRows) {
  // Feed columns: Rank, Team, Pld, W, D, L, GF, GA, GD, Pts
  // Insert a blank badge column after Rank.
  const rows = allRows
    .filter(row => row && row.length >= 10)
    .filter(row => /^\d+$/.test(String(row[0] || "").trim()))
    .slice(0, 16);

  const headings = [
    "Rank", "", "Team", "Pld", "W", "D",
    "L", "GF", "GA", "GD", "Pts"
  ];

  const head = document.getElementById("tableHead");
  const body = document.getElementById("tableBody");

  head.innerHTML = "<tr>" + headings.map(h =>
    `<th>${escapeHtml(h)}</th>`
  ).join("") + "</tr>";

  body.innerHTML = rows.map(row => {
    const rank = row[0] || "";
    const team = row[1] || "";

    const values = [
      rank, "", team,
      row[2] || "", row[3] || "", row[4] || "",
      row[5] || "", row[6] || "", row[7] || "",
      row[8] || "", row[9] || ""
    ];

    return "<tr>" + values.map((value, index) => {
      if (index === 1) {
        return `<td>${badgeHtml(team)}</td>`;
      }

      const className = index === 10
        ? ' class="points"'
        : "";

      return `<td${className}>${escapeHtml(value)}</td>`;
    }).join("") + "</tr>";
  }).join("");

  document.getElementById("status").textContent =
    "LIVE STANDINGS · Last updated " +
    new Date().toLocaleTimeString();
}


  async function loadStandings() {
    const status = document.getElementById("status");

    try {
      const url = CSV_URL +
        (CSV_URL.includes("?") ? "&" : "?") +
        "t=" + Date.now();

      const response = await fetch(url, { cache: "no-store" });

      if (!response.ok) {
        throw new Error("Unable to retrieve the spreadsheet.");
      }

      const text = await response.text();

      const parsed = Papa.parse(text, {
        skipEmptyLines: false
      });

      if (parsed.errors && parsed.errors.length &&
          !parsed.data.length) {
        throw new Error("The spreadsheet data could not be read.");
      }

      renderTable(parsed.data);
    } catch (error) {
      console.error(error);
      status.textContent =
        "Unable to refresh standings. Retrying shortly...";
    }
  }

  loadStandings();
  setInterval(loadStandings, REFRESH_INTERVAL_MS);
</script>
</body>
</html>
