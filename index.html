<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Automatically refreshes the window safely every 30 seconds to fetch live scoring updates -->
  <meta http-equiv="refresh" content="30">
  <title>Esquina Park Rangers Live Match Results</title>
  <style>
    :root {
      --primary: #1b4332;
      --accent: #40916c;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #2d3748;
      --success: #52b788;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    header {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      text-align: center;
      padding: 2.5rem 1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,.1);
    }
    header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2rem);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    header p { margin: .5rem 0 0; opacity: .9; font-size: 1.1rem; }
    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.2);
      padding: .45rem .85rem;
      border-radius: 20px;
      font-size: .85rem;
      margin-top: 1rem;
      font-weight: bold;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      flex: 0 0 8px;
      animation: blink 1.5s infinite;
    }
    @keyframes blink { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
main { width: 95%; max-width: 1400px; margin: 2rem auto; }
    .card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.05);
      padding: 1rem;
      overflow: hidden;
    }
    .dashboard-window {
      position: relative;
      width: 100%;
      height: 750px; 
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }
    iframe {
      position: absolute;
      top: -45px; 
      left: 0;
      width: 100%;
      height: calc(100% + 45px);
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Esquina Park Rangers</h1>
    <p>5th Annual International Tournament - Match Center</p>
    <div class="live-indicator" id="live-indicator">
      <span class="dot"></span>
      <span>Live Center Active (Auto-Refreshes every 30s)</span>
    </div>
  </header>
<main>
    <div class="card">
      <div class="dashboard-window">
        <!-- Native Google HTML Stream: Targets your exact results tab ID and displays range A2:G124 perfectly -->
        <iframe src="https://google.com"></iframe>
      </div>
    </div>
  </main>
</body>
</html>
