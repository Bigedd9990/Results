
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="30">

  <title>Esquina Park Rangers Live Match Results</title>

  <style>
    :root {
      --primary: #1b4332;
      --accent: #40916c;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #2d3748;
      --success: #52b788;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      text-align: center;
      padding: 2rem 1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,.1);
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2rem);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    header p {
      margin: .6rem 0 0;
      font-size: 1rem;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.18);
      padding: .5rem .85rem;
      border-radius: 25px;
      font-size: .85rem;
      margin-top: 1rem;
      font-weight: bold;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: var(--success);
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }

    main {
      width: 96%;
      max-width: 1400px;
      margin: 1.5rem auto;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
      padding: 12px;
    }

    .dashboard-window {
      width: 100%;
      height: 75vh;
      min-height: 500px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: auto;
      background: white;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      text-align: center;
      padding: 0 1rem 1.5rem;
      color: #64748b;
      font-size: .85rem;
    }

    @media (max-width: 600px) {
      header {
        padding: 1.5rem .75rem;
      }

      main {
        width: 100%;
        margin: 1rem auto;
      }

      .card {
        padding: 6px;
        border-radius: 0;
      }

      .dashboard-window {
        height: 70vh;
        min-height: 450px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Esquina Park Rangers</h1>
    <p>5th Annual International Tournament - Match Center</p>

    <div class="live-indicator">
      <span class="dot"></span>
      <span>Live Results • Refreshes every 30 seconds</span>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="dashboard-window">
        <iframe
  title="Esquina Park Rangers Live Match Results"
  src="https://docs.google.com/spreadsheets/d/1z9-WN-5GVVAyV47wT7rG_-MgGpD_iAypltRiHFHUt4M/pubhtml?gid=1887191572&amp;range=A2%3AG124&amp;single=true&amp;widget=true&amp;headers=false"
  style="width:100%; height:100%; border:0;"
  loading="eager">
</iframe>
      </div>
    </div>
  </main>

  <footer>
    Esquina Park Rangers • Live Tournament Match Center
  </footer>
</body>
</html>
