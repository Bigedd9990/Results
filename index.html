
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Esquina Park Rangers | International Walking Football Cup</title>

  <meta name="description" content="Live league table, fixtures and results for the Esquina Park Rangers International Walking Football Cup in Rojales, 5–6 November 2026.">

  <meta name="theme-color" content="#572638">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(ellipse at top, #754054 0%, #351724 65%);
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: auto;
      padding: 28px 20px;
      text-align: center;
    }

    .badge {
      width: 112px;
      height: 112px;
      margin: 0 auto 20px;
      border: 4px solid #b9e6f5;
      border-radius: 50%;
      background: #ffffff;
      color: #572638;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 22px rgba(0, 0, 0, 0.3);
    }

    .badge .football {
      font-size: 39px;
      line-height: 1.1;
    }

    .badge .badge-text {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-top: 5px;
    }

    .club {
      margin: 0;
      color: #b9e6f5;
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .event {
      margin: 12px 0 0;
      font-size: clamp(19px, 5vw, 25px);
      font-weight: 800;
      line-height: 1.25;
    }

    .subtitle {
      margin: 12px 0 5px;
      color: #f3e8ed;
      font-size: 16px;
      line-height: 1.5;
    }

    .date {
      color: #b9e6f5;
      font-size: 16px;
      font-weight: bold;
      margin: 5px 0 30px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .main-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      min-height: 86px;
      padding: 18px;
      border: 3px solid #b9e6f5;
      border-radius: 16px;
      background: #b9e6f5;
      color: #351724;
      text-decoration: none;
      font-size: 21px;
      font-weight: 900;
      line-height: 1.2;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.18);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .main-button.secondary {
      background: #ffffff;
      border-color: #ffffff;
    }

    .main-button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
    }

    .button-icon {
      font-size: 31px;
      flex-shrink: 0;
    }

    .button-copy {
      display: flex;
      flex-direction: column;
      gap: 5px;
      text-align: left;
    }

    .button-copy small {
      font-size: 13px;
      font-weight: normal;
      opacity: 0.8;
    }

    footer {
      margin-top: 34px;
      color: #e5d5dc;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 360px) {
      .container {
        padding: 22px 14px;
      }

      .main-button {
        font-size: 18px;
        padding: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="badge" aria-label="Tournament football emblem">
      <span class="football">⚽</span>
      <span class="badge-text">ESQUINA PR</span>
    </div>

    <h1 class="club">ESQUINA PARK RANGERS</h1>

    <h2 class="event">
      INTERNATIONAL<br>
      WALKING FOOTBALL CUP
    </h2>

    <p class="subtitle">
      Welcome to the tournament!
    </p>

    <p class="date">
      📍 Rojales, Spain<br>
      5–6 November 2026
    </p>

    <nav class="buttons" aria-label="Tournament information">

      <a class="main-button" href="league.html">
        <span class="button-icon">🏆</span>
        <span class="button-copy">
          LIVE LEAGUE TABLE
          <small>View the latest standings</small>
        </span>
      </a>

      <a class="main-button secondary" href="fixtures.html">
        <span class="button-icon">⚽</span>
        <span class="button-copy">
          FIXTURES &amp; RESULTS
          <small>View matches for either day</small>
        </span>
      </a>

    </nav>

    <footer>
      Esquina Park Rangers<br>
      International Walking Football Cup 2026
    </footer>

  </main>
</body>
</html>
