
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="30">

  <title>Esquina Park Rangers Live Match Results</title>

  <style>
    :root {
      --primary: #1b4332;
      --accent: #40916c;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #2d3748;
      --success: #52b788;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      text-align: center;
      padding: 2rem 1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,.1);
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2rem);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    header p {
      margin: .6rem 0 0;
      font-size: 1rem;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.18);
      padding: .5rem .85rem;
      border-radius: 25px;
      font-size: .85rem;
      margin-top: 1rem;
      font-weight: bold;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: var(--success);
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }

    main {
      width: 96%;
      max-width: 1400px;
      margin: 1.5rem auto;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
      padding: 12px;
    }

    .dashboard-window {
      width: 100%;
      height: 75vh;
      min-height: 500px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: auto;
      background: white;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      text-align: center;
      padding: 0 1rem 1.5rem;
      color: #64748b;
      font-size: .85rem;
    }

    @media (max-width: 600px) {
      header {
        padding: 1.5rem .75rem;
      }

      main {
        width: 100%;
        margin: 1rem auto;
      }

      .card {
        padding: 6px;
        border-radius: 0;
      }

      .dashboard-window {
        height: 70vh;
        min-height: 450px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Esquina Park Rangers</h1>
    <p>5th Annual International Tournament - Match Center</p>

    <div class="live-indicator">
      <span class="dot"></span>
      <span>Live Results • Refreshes every 30 seconds</span>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="dashboard-window">
        <div id="results-container">Loading tournament results...</div>

<style>
  #results-container {
    overflow-x: auto;
    max-height: 100%;
    font-family: Arial, sans-serif;
  }

  #results-container table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    font-size: 14px;
  }

  #results-container td,
  #results-container th {
    border: 1px solid #ddd;
    padding: 8px 10px;
    text-align: left;
    white-space: nowrap;
  }

  #results-container tr:nth-child(even) {
    background: #f2f6f3;
  }

  #results-container tr:first-child {
    font-weight: bold;
    background: #1b4332;
    color: white;
  }

  #results-container .error {
    padding: 20px;
    color: #a61b1b;
  }
</style>

<script>
(async function loadResults() {
  const container = document.getElementById("results-container");

  const csvUrl =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vTeEkmGfdMyY5ILwraF8-Axuzx8-U5IAgNO9NYzd9ua-ogBiwaMMKKAq7zpK2lBseMnJ4WAC-AQ1Glv/pub?gid=1887191572&single=true&output=csv";

  try {
    const response = await fetch(csvUrl, { cache: "no-store" });

    if (!response.ok) {
      throw new Error("Google Sheets returned HTTP " + response.status);
    }

    const csv = await response.text();

    if (!csv.trim() || csv.trimStart().startsWith("<!DOCTYPE")) {
      throw new Error("The published spreadsheet did not return CSV data.");
    }

    // Parse CSV, including quoted cells containing commas or line breaks.
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];

        if (ch === '"') {
          if (quoted && text[i + 1] === '"') {
            cell += '"';
            i++;
          } else {
            quoted = !quoted;
          }
        } else if (ch === "," && !quoted) {
          row.push(cell);
          cell = "";
        } else if ((ch === "\n" || ch === "\r") && !quoted) {
          if (ch === "\r" && text[i + 1] === "\n") i++;
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += ch;
        }
      }

      if (cell.length || row.length) {
        row.push(cell);
        rows.push(row);
      }

      return rows;
    }

    // Published CSV begins at A1, so take A2:G124.
    const rows = parseCSV(csv).slice(1, 124).map(row =>
      row.slice(0, 7)
    );

    const table = document.createElement("table");

    rows.forEach((cells, index) => {
      const tr = document.createElement("tr");

      cells.forEach(value => {
        const cell = document.createElement(index === 0 ? "th" : "td");
        cell.textContent = value;
        tr.appendChild(cell);
      });

      table.appendChild(tr);
    });

    container.replaceChildren(table);

  } catch (error) {
    container.innerHTML = "";
    const message = document.createElement("div");
    message.className = "error";
    message.textContent =
      "Unable to load results: " + error.message +
      ". Check that the sheet is published and accessible.";
    container.appendChild(message);
    console.error(error);
  }
})();
</script>

</html>
