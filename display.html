<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournament Big Screen</title>
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
    }

    body {
      overflow: hidden;
      background: #351724;
    }

    iframe {
      display: block;
      opacity: 0;
      transition: opacity 700ms ease-in-out;
    }

    .progress-track {
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      overflow: hidden;
      background: rgba(53, 23, 36, 0.45);
    }

    .progress-bar {
      width: 100%;
      height: 100%;
      background: #b9e6f5;
      transform: scaleX(0);
      transform-origin: left center;
    }

    @media (prefers-reduced-motion: reduce) {
      iframe {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <iframe id="screen" title="Tournament results"></iframe>
  <div class="progress-track" role="progressbar" aria-label="Time remaining on this page" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <script>
    const madridDate = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Madrid",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(new Date());

    const league = { page: "league.html", duration: 30_000 };
    const day1 = { page: "day1.html", duration: 15_000 };
    const day2 = { page: "day2.html", duration: 15_000 };
    const scorers = { page: "tgs.html", duration: 15_000 };

    // On each tournament day, show only that day's fixtures page.
    // Outside the tournament dates, show all pages as a preview.
    const screens = madridDate === "2026-11-05"
      ? [league, day1, scorers]
      : madridDate === "2026-11-06"
        ? [league, day2, scorers]
        : [league, day1, day2, scorers];

    const frame = document.getElementById("screen");
    const progressBar = document.getElementById("progressBar");
    const progressTrack = document.querySelector(".progress-track");
    const transitionMs = 700;
    let current = 0;
    let transitionTimer;
    let rotationTimer;

    function showScreen(index) {
      current = index;
      window.clearTimeout(transitionTimer);
      window.clearTimeout(rotationTimer);

      progressBar.style.transition = "none";
      progressBar.style.transform = "scaleX(0)";
      progressTrack.setAttribute("aria-valuenow", "0");

      // Ignore any subsequent iframe reloads (for example, page-level refreshes).
      frame.onload = null;
      frame.style.opacity = "0";

      // Fade out before loading the next page, then start its display interval once loaded.
      transitionTimer = window.setTimeout(() => {
        frame.onload = () => {
          frame.onload = null;
          frame.style.opacity = "1";

          const duration = screens[current].duration;
          progressBar.style.transition = `transform ${duration}ms linear`;
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              progressBar.style.transform = "scaleX(1)";
            });
          });

          const startedAt = performance.now();
          const updateProgress = () => {
            const progress = Math.min((performance.now() - startedAt) / duration, 1);
            progressTrack.setAttribute("aria-valuenow", String(Math.round(progress * 100)));
            if (progress < 1 && current === index) requestAnimationFrame(updateProgress);
          };
          requestAnimationFrame(updateProgress);

          rotationTimer = window.setTimeout(
            () => showScreen((current + 1) % screens.length),
            duration
          );
        };
        frame.src = screens[current].page;
      }, transitionMs);
    }

    showScreen(0);
  </script>
</body>
</html>
