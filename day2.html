```html
<script>
(async function loadResults() {
  const container = document.getElementById("results-container");

  const csvUrl =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vTeEkmGfdMyY5ILwraF8-Axuzx8-U5IAgNO9NYzd9ua-ogBiwaMMKKAq7zpK2lBseMnJ4WAC-AQ1Glv/pub?gid=1887191572&single=true&output=csv";

  function parseCSV(text) {
    const rows = [];
    let row = [], cell = "", quoted = false;

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];

      if (ch === '"') {
        if (quoted && text[i + 1] === '"') {
          cell += '"';
          i++;
        } else {
          quoted = !quoted;
        }
      } else if (ch === "," && !quoted) {
        row.push(cell);
        cell = "";
      } else if ((ch === "\n" || ch === "\r") && !quoted) {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      } else {
        cell += ch;
      }
    }

    if (cell.length || row.length) {
      row.push(cell);
      rows.push(row);
    }
    return rows;
  }

  function addTeamBadge(cell, teamName) {
    const name = teamName.trim();
    if (!name) {
      cell.textContent = name;
      return;
    }

    const img = document.createElement("img");
    img.className = "team-badge";
    img.alt = "";
    img.width = 30;
    img.height = 30;
    img.style.cssText =
      "width:30px;height:30px;object-fit:contain;vertical-align:middle;margin-right:8px;";

    img.src = "badges/" + name + ".png";

    img.onerror = function () {
      if (!this.dataset.triedLowercase) {
        this.dataset.triedLowercase = "yes";
        this.src = "badges/" + name.toLowerCase() + ".png";
      } else {
        this.remove();
      }
    };

    cell.textContent = "";
    cell.style.whiteSpace = "nowrap";
    cell.appendChild(img);
    cell.appendChild(document.createTextNode(name));
  }

  try {
    const response = await fetch(csvUrl, { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);

    const csv = await response.text();
    if (csv.trimStart().startsWith("<!DOCTYPE")) {
      throw new Error("Google did not return CSV data");
    }

    // Day 2: sheet rows 65–124, columns A–G.
    const rows = parseCSV(csv).slice(64, 124)
      .map(row => row.slice(0, 7));

    const table = document.createElement("table");
    const tbody = document.createElement("tbody");

    rows.forEach((cells, index) => {
      const tr = document.createElement("tr");

      cells.forEach((value, columnIndex) => {
        const cell = document.createElement(index === 0 ? "th" : "td");

        // Column D = index 3; column G = index 6.
        if (index !== 0 && (columnIndex === 3 || columnIndex === 6)) {
          addTeamBadge(cell, value);
        } else {
          cell.textContent = value;
        }

        tr.appendChild(cell);
      });

      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    container.className = "";
    container.replaceChildren(table);

  } catch (error) {
    container.className = "status";
    container.textContent =
      "Unable to load results. Please check the published Google Sheet.";
    console.error(error);
  }
})();
</script>
